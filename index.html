<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0c0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/planning-poker/manifest.webmanifest">
<title>Planning Poker — Business Wife Edition</title>
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/planning-poker/icons/icon-192.png">
<link rel="stylesheet" href="/components/bw-card.css">
<link rel="stylesheet" href="/components/bw-wife-picker.css">
<script src="/components/bw-roster.js"></script>
<script src="/components/bw-card.js"></script>
<script src="/components/bw-wife-picker.js"></script>
<link rel="stylesheet" href="/planning-poker/app.css">
<script>
/* Lobby chrome before first paint. ?lobby= is ignored. Room paths stay on the in-room header. */
(function () {
  var room = /^\/planning-poker\/r\/[a-z0-9]{6}\/?$/.test(location.pathname);
  if (!room) document.documentElement.classList.add("in-lobby");
})();
</script>
</head>
<body>
  <header class="brand">
    <a class="brand-kicker" href="/" style="color:inherit;text-decoration:none">Business Wife</a>
    <h1>Planning Poker <span class="tag">Edition</span></h1>
    <p class="sub sub-room">Create a boardroom, share the link, estimate stories together.</p>
  </header>

  <div class="wrap">
    <div id="lobby" class="card" data-testid="lobby-screen">
      <div class="fan" id="lobbyFan" data-testid="lobby-fan" aria-hidden="true"></div>
      <div class="lobby-panel">
        <div class="lobby-actions">
          <button class="join-btn" id="createBtn" data-testid="create-btn">Create a boardroom</button>
          <div class="lobby-join">
            <label class="room-code-label" for="roomCode">Room code</label>
            <div class="lobby-row">
              <input id="roomCode" data-testid="room-code" aria-label="Room code" placeholder="abc123" maxlength="6" autocomplete="off" spellcheck="false">
              <button class="btn gold" id="joinRoomBtn" data-testid="join-room-btn">Join</button>
            </div>
          </div>
        </div>
        <div class="err" id="lobbyErr" data-testid="lobby-err"></div>
      </div>
    </div>

    <!-- JOIN -->
    <div id="join" class="card hidden" data-testid="join-screen">
      <h2>Choose your Business Wife</h2>
      <bw-wife-picker id="picker" roster-name="name" taken-label="Already in the boardroom"></bw-wife-picker>

      <button class="join-btn" id="joinBtn" data-testid="join-btn" disabled>Enter the boardroom</button>

      <div class="obs-row">
        <input id="obsName" data-testid="observer-name" placeholder="Your name" maxlength="24" autocomplete="off">
        <button class="btn gold" id="obsBtn" data-testid="observer-btn">Watch as observer</button>
      </div>
      <div class="err" id="joinErr" data-testid="join-err"></div>
    </div>

    <div id="shareCard" class="card invite-bar hidden" data-testid="share-card">
      <div class="room-code-big" data-testid="room-code-big">
        <span class="code" id="roomCodeBig">————</span>
        <span class="hint">room code</span>
      </div>
      <div class="invite-actions">
        <input id="shareUrl" class="hidden" data-testid="share-url" readonly tabindex="-1" aria-hidden="true">
        <button class="btn gold" id="shareBtn" data-testid="share-btn" type="button">Share</button>
        <button class="btn" id="copyBtn" data-testid="copy-btn" type="button">Copy</button>
        <div class="host-menu-wrap hidden" id="hostBar" data-testid="host-bar">
          <button type="button" class="host-menu-btn" id="hostMenuBtn" data-testid="host-menu-btn" aria-haspopup="true" aria-expanded="false" title="Host controls">⋯</button>
          <div class="host-menu hidden" id="hostMenu" data-testid="host-menu" role="menu">
            <label class="toggle" title="Prevent new players from joining">
              <input type="checkbox" id="lockToggle" data-testid="lock-toggle">
              Lock joining
            </label>
            <label class="toggle" title="Beep and vibrate when cards are revealed">
              <input type="checkbox" id="soundToggle" data-testid="sound-toggle">
              Sound / haptic
            </label>
          </div>
        </div>
      </div>
    </div>

    <!-- TABLE -->
    <div id="game" class="hidden" data-testid="game-screen">
      <div class="stage-board" id="stageBoard">
        <div class="stage-head" id="stageHead">
          <div class="stage-meta">
            <span class="round-label">Round <span id="round">1</span></span>
            <span class="badge" id="phaseBadge"></span>
            <span class="actor-line" id="actorLine" data-testid="actor-line" role="status" aria-live="polite"></span>
          </div>
          <input class="question" id="question" data-testid="question" placeholder="Story for this round…" autocomplete="off">
        </div>
        <div class="table" id="table" data-testid="boardroom"></div>
        <div class="summary hidden" id="voteSummary" data-testid="vote-summary"></div>
        <div class="status" id="status" data-testid="status"></div>
        <div class="btnrow" style="justify-content:center">
          <button class="btn primary" id="revealBtn" data-testid="reveal-btn">Reveal all</button>
          <button class="btn hidden" id="revoteBtn" data-testid="revote-btn">Re-Vote</button>
          <button class="btn" id="nextBtn" data-testid="next-btn">Next round →</button>
        </div>
      </div>

      <div class="history" id="historyCard" data-testid="history-card">
        <details id="historyDetails">
          <summary>Past rounds <span id="historyCount"></span></summary>
          <div class="history-list" id="historyList" data-testid="history-list">
            <div class="history-empty">No past rounds yet this session.</div>
          </div>
        </details>
      </div>

      <div class="card hand" id="playCard">
        <h2>Your play</h2>
        <div class="cards" id="cards" data-testid="cards"></div>
        <div class="leave"><a id="leaveLink" data-testid="leave-link">leave the boardroom</a></div>
      </div>
    </div>
  </div>

  <footer>Inspired by the great H S<br>"She closes the deal before lunch."</footer>

<script src="/planning-poker/app.js"></script>
</body>
</html>
