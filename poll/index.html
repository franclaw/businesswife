<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Poll — Business Wife</title>
<meta name="theme-color" content="#0f0c0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Live polls. She counts the room before you finish the question.">
<link rel="manifest" href="/poll/manifest.webmanifest">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/poll/icons/icon-192.png">
<link rel="stylesheet" href="/components/bw-card.css">
<link rel="stylesheet" href="/components/bw-wife-picker.css">
<script src="/components/bw-roster.js"></script>
<script src="/components/bw-card.js"></script>
<script src="/components/bw-wife-picker.js"></script>
<style>
  :root {
    --bg: #0f0c0e;
    --surface: #171214;
    --surface-2: #1e171a;
    --border: #2e2428;
    --border-strong: #3d3036;
    --text: #f2ebe6;
    --muted: #9a8a90;
    --faint: #8d7f85;
    --accent: #c43d6e;
    --accent-hover: #d54f7f;
    --accent-text: #e0679a;
    --accent-soft: rgba(196, 61, 110, 0.14);
    --gold: #c9a227;
    --gold-soft: rgba(201, 162, 39, 0.12);
    --radius: 10px;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.5;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: max(20px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  a.brand {
    color: var(--faint);
    text-decoration: none;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  a.brand:hover { color: var(--accent-text); }
  .kicker {
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 6px;
  }
  h1 {
    font-size: 1.35rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-bottom: 4px;
  }
  .wit { color: var(--muted); font-size: 0.92rem; margin-bottom: 26px; }
  .wrap { width: 100%; max-width: 480px; }
  .panel {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px 20px;
  }
  label {
    display: block;
    font-size: 0.74rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--faint);
    margin-bottom: 6px;
  }
  input[type="text"], input[type="number"] {
    width: 100%;
    padding: 12px 14px;
    border-radius: var(--radius);
    border: 1px solid var(--border-strong);
    background: var(--bg);
    color: var(--text);
    font-family: inherit;
    font-size: 1rem;
  }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  input::placeholder { color: var(--faint); }
  button {
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    border-radius: 8px;
    border: 0;
    padding: 13px 20px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .primary { background: var(--accent); color: #fff; width: 100%; }
  .primary:hover:not(:disabled) { background: var(--accent-hover); }
  .ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border-strong);
  }
  .ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
  .row { display: flex; gap: 10px; align-items: center; }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .hint { color: var(--faint); font-size: 0.78rem; margin-top: 10px; }
  .err { color: var(--accent-text); font-size: 0.86rem; min-height: 1.2em; margin-top: 8px; }
  .divider {
    display: flex; align-items: center; gap: 12px;
    color: var(--faint); font-size: 0.74rem;
    letter-spacing: 0.12em; text-transform: uppercase;
    margin: 22px 0;
  }
  .divider::before, .divider::after { content: ""; height: 1px; background: var(--border); flex: 1; }
  .opt-row { display: flex; gap: 8px; margin-bottom: 8px; position: relative; }
  .opt-row button { min-width: 40px; padding: 0 12px; }
  /* Linked text tooltip for the icon-only remove button (hover + keyboard focus). */
  .opt-row .tip {
    position: absolute;
    right: 0;
    bottom: calc(100% - 2px);
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 12px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity .12s;
  }
  .opt-row button:hover + .tip,
  .opt-row button:focus-visible + .tip { opacity: 1; }
  .code {
    font-family: var(--mono);
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  /* poll screen */
  .poll-meta {
    display: flex; justify-content: space-between; align-items: center;
    gap: 10px; margin-bottom: 16px; flex-wrap: wrap;
  }
  .poll-code { color: var(--gold); font-size: 0.8rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; }
  .question { font-size: 1.25rem; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 18px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    position: relative;
    display: block; width: 100%;
    text-align: left;
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    font-weight: 500;
    overflow: hidden;
  }
  .option:hover:not(:disabled) { border-color: var(--accent); }
  .option:disabled { cursor: default; opacity: 1; }
  .you-chip:disabled { opacity: 1; cursor: default; }
  .option .bar {
    position: absolute; inset: 0 auto 0 0;
    width: 0%;
    background: var(--accent-soft);
    transition: width .35s ease;
  }
  .option .txt { position: relative; display: flex; flex-direction: column; align-items: stretch; gap: 2px; }
  .option .opt-line { display: flex; justify-content: space-between; gap: 12px; }
  .option .pct { color: var(--muted); font-family: var(--mono); font-size: 0.86rem; }
  .option.mine { border-color: var(--accent); }
  .option.mine .txt { color: var(--text); }
  .option.mine::after {
    content: "✓ your vote";
    position: absolute; right: 14px; bottom: 3px;
    font-size: 0.66rem; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--accent-text);
  }
  .tally { color: var(--muted); font-size: 0.86rem; margin-top: 16px; }
  .tally strong { color: var(--text); }
  .banner {
    display: none;
    margin-bottom: 16px;
    padding: 10px 14px;
    border-radius: var(--radius);
    background: var(--gold-soft);
    border: 1px solid rgba(201, 162, 39, 0.35);
    color: var(--gold);
    font-size: 0.86rem;
    font-weight: 600;
  }
  .banner.on { display: block; }
  .share { margin-top: 18px; }
  .share input { font-family: var(--mono); font-size: 0.82rem; }
  .actions { display: flex; gap: 10px; margin-top: 18px; }
  .actions button { flex: 1; }
  .live {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--faint); font-size: 0.72rem;
    letter-spacing: 0.1em; text-transform: uppercase;
  }
  .live .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
  .live.on .dot { background: #3fbf7f; }
  footer {
    margin-top: auto; padding-top: 36px;
    color: var(--faint); font-size: 0.74rem; text-align: center; line-height: 1.6;
    background: var(--bg);
  }
  [hidden] { display: none !important; }
  /* identity picker */
  .you-chip {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 0.82rem; color: var(--muted); font-family: inherit;
    background: none; border: 0; padding: 2px 4px; border-radius: 8px; cursor: pointer;
  }
  .you-chip:hover { color: var(--text); }
  .you-chip img { width: 26px; height: 36px; object-fit: cover; object-position: top; border-radius: 5px; border: 1px solid var(--border-strong); }
  .you-chip .bw-framed { border-radius: 5px; }
  /* At chip size the option-A crop would chop the ornament into stubs; the
     full-scale frame matches how stock portraits' baked frames read here. */
  .you-chip .bw-framed::after { inset: 0; }
  .you-chip .emoji { font-size: 1.1rem; }
  .you-chip b { color: var(--text); font-weight: 600; }
  .id-overlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(15, 12, 14, 0.92);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; overflow: auto;
  }
  .id-sheet {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    /* Same frame as the Planning Poker join card, so the shared picker gets
       the same width, columns and card size in both apps. */
    padding: 28px 24px 24px; max-width: 980px; width: 100%; text-align: center;
    border-radius: 12px; max-height: calc(100vh - 40px); overflow: auto;
  }
  @media (max-width: 640px) {
    .id-sheet { padding: 16px; }
  }
  .id-sheet > h3 { font-size: 1.05rem; margin-bottom: 4px; }
  .id-sheet .sub { color: var(--muted); font-size: 0.84rem; margin-bottom: 16px; }
  /* The gallery is <bw-wife-picker>: /components/bw-wife-picker.css. */
  .id-sheet .id-actions { display: flex; gap: 10px; margin-top: 14px; }
  .id-sheet .id-actions button { flex: 1; }
  .voters { display: flex; align-items: center; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .voters > span { display: inline-flex; align-items: center; flex-shrink: 0; }
  .voters img { display: block; width: 36px; height: 54px; object-fit: contain; object-position: top; border-radius: 4px; border: 1px solid var(--border-strong); }
  .voters .bw-framed { border-radius: 4px; }
  .voters .bw-framed::after { inset: 0; }
  .voters .emoji { display: flex; align-items: center; justify-content: center; width: 36px; height: 54px; font-size: 1.4rem; }
  .voters .plus { font-size: 0.68rem; color: var(--faint); align-self: center; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
</style>
</head>
<body>
  <a class="brand" href="/">Business Wife</a>
  <div class="kicker">The room, counted</div>
  <h1>Poll</h1>
  <p class="wit">She knows how it ends before you finish the question.</p>

  <div class="wrap">
    <!-- Lobby -->
    <div id="lobby-screen" data-testid="lobby-screen">
      <div class="panel">
        <label for="create-question">Ask the room</label>
        <div class="stack">
          <input id="create-question" data-testid="question-input" type="text" maxlength="200" placeholder="Where do we spend the offsite?">
          <div id="option-rows" data-testid="option-rows"></div>
          <div class="row">
            <button type="button" class="ghost" id="add-option" data-testid="add-option-btn" style="min-width:0;padding:10px 14px;font-size:0.84rem">+ Add option</button>
          </div>
          <div class="err" id="create-err" data-testid="create-error"></div>
          <button type="button" class="primary" id="create-btn" data-testid="create-btn">Create poll</button>
        </div>
      </div>

      <div class="divider">or join</div>

      <div class="panel">
        <label for="join-code">Poll code</label>
        <div class="row">
          <input id="join-code" data-testid="join-code" class="code" type="text" inputmode="latin" autocapitalize="characters" autocomplete="off" spellcheck="false" maxlength="6" placeholder="abc123">
          <button type="button" class="ghost" id="join-btn" data-testid="join-btn" style="min-width:110px">Open</button>
        </div>
        <div class="err" id="join-err" data-testid="join-error"></div>
      </div>
    </div>

    <!-- Poll -->
    <div id="poll-screen" data-testid="poll-screen" hidden>
      <div class="panel">
        <div class="poll-meta">
          <span class="poll-code">Poll <span class="code" data-testid="poll-code"></span></span>
          <button type="button" class="you-chip" id="you-chip" data-testid="you-chip" hidden></button>
          <span class="live" id="live" data-testid="live-indicator"><span class="dot"></span><span id="live-text">connecting</span></span>
        </div>
        <div class="banner" id="closed-banner" data-testid="closed-banner">Polling closed — final numbers.</div>
        <div class="question" id="question" data-testid="poll-question"></div>
        <div class="options" id="options" data-testid="options"></div>
        <div class="tally" id="tally" data-testid="tally"></div>
        <div class="share">
          <label for="share-url">Share link</label>
          <div class="row">
            <input id="share-url" data-testid="share-url" type="text" readonly>
            <button type="button" class="ghost" id="copy-btn" data-testid="copy-btn" style="min-width:86px">Copy</button>
          </div>
        </div>
        <div class="actions">
          <button type="button" class="ghost" id="close-btn" data-testid="close-btn" hidden>Close polling</button>
          <button type="button" class="ghost" id="new-btn" data-testid="new-poll-btn">New poll</button>
        </div>
      </div>
    </div>
  </div>

  <footer>Business Wife<br>"She closes the deal before lunch."</footer>

  <!-- Identity picker -->
  <div class="id-overlay" id="id-overlay" data-testid="identity-overlay" hidden>
    <div class="id-sheet">
      <h3>Who are you in this room?</h3>
      <p class="sub">Pick a business wife — she shows up next to your vote.</p>
      <bw-wife-picker id="picker" data-testid="identity-picker" roster-name="first" taken-label="Taken"></bw-wife-picker>
      <p class="err" id="identity-error" data-testid="identity-error" role="alert"></p>
      <div class="id-actions" id="id-actions" hidden>
        <button type="button" class="primary" id="id-add-btn" data-testid="identity-add-btn" disabled>Use her</button>
      </div>
    </div>
  </div>

<script>
const $ = (sel) => document.querySelector(sel);
const API = "/poll/api/polls";
const MAX_OPTIONS = 8;
const MIN_OPTIONS = 2;

const state = {
  pollId: null,
  voterId: voterId(),
  ownerToken: null,
  myVote: null,
  voting: false,
  identityBusy: false,
  claimedIdentity: null,
  data: null,
  es: null,
  pollTimer: null,
};

function voterId() {
  let id = sessionStorage.getItem("bw_poll_voter");
  if (!id) {
    id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2));
    sessionStorage.setItem("bw_poll_voter", id);
  }
  return id;
}

// The owner token comes back once, at creation, and is the only way to close
// the poll. Kept on this device; older builds marked the creator per tab and
// proved it with the tab's voter id, which still works for their polls.
function ownerKey(id) { return "bw_poll_owner_" + id; }
function ownerTokenFor(id) {
  try {
    const t = localStorage.getItem(ownerKey(id));
    if (t) return t;
  } catch {}
  return sessionStorage.getItem("bw_poll_creator_" + id) === "1" ? state.voterId : null;
}
function voteKey(id) { return "bw_poll_vote_" + id; }

// ---------- identity ----------
// Who you are in this room: a Business Wife from the shared picker. Stored on
// this device and sent with each vote so she shows up next to it.
const IDENTITY_KEY = "bw_poll_identity";
const picker = $("#picker");

function escapeHtml(x) {
  return String(x).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
// Only pictures the server accepts: built-in portraits, small uploads, emoji.
function usableIcon(icon) {
  if (!icon) return false;
  if (/^\/img\/[a-z0-9-]+\.png$/.test(icon)) return true;
  if (/^data:image\//.test(icon)) return icon.length <= 20000;
  return !/[:/]/.test(icon) && [...icon].length <= 8;
}
function getIdentity() {
  try {
    const id = JSON.parse(localStorage.getItem(IDENTITY_KEY) || "null");
    if (!id || !id.name) return null;
    if (!usableIcon(id.icon)) id.icon = "💼";   // older builds hot-linked URLs
    return id;
  } catch { return null; }
}
function setIdentity(id) {
  try { localStorage.setItem(IDENTITY_KEY, JSON.stringify(id)); } catch {}
  renderChip();
}
function avatarHtml(icon, raw) {
  if (!icon) return '<span class="emoji">💼</span>';
  if (icon.startsWith("/img/") || icon.startsWith("data:")) {
    // raw: an uploaded picture stored without a baked frame — the frame is a
    // CSS overlay (.bw-framed, styled via /components/bw-wife-picker.css).
    const img = '<img src="' + escapeHtml(window.bwThumb(icon)) + '" alt="">';
    return raw ? '<span class="bw-framed">' + img + '</span>' : img;
  }
  return '<span class="emoji">' + escapeHtml(icon) + '</span>';
}
function renderChip() {
  const chip = $("#you-chip");
  const id = state.claimedIdentity || getIdentity();
  if (!id) { chip.hidden = true; return; }
  chip.hidden = false;
  chip.innerHTML = avatarHtml(id.icon, id.raw) + "<span>You: <b>" + escapeHtml(id.name) + "</b></span>";
  chip.disabled = !!state.myVote || state.voting;
  chip.title = state.myVote ? "Identity on your submitted vote" : "Change your identity";
}
function showIdentityPicker() {
  if (state.myVote || state.voting) return;
  picker.refresh();
  $("#id-overlay").hidden = false;
  const current = getIdentity();
  if (current) picker.selectName(current.name);
  syncIdentityBtn();
}
async function useIdentity(v, restoring = false) {
  if (!v || !v.name || state.identityBusy || state.voting || (state.myVote && !restoring)) return;
  state.identityBusy = true;
  $("#identity-error").textContent = "";
  syncIdentityBtn();
  try {
    const res = await fetch(API + "/" + state.pollId + "/identity", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ voterId: state.voterId, name: v.name, icon: v.icon, raw: !!v.raw, subtitle: v.subtitle }),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || "Could not select her. Try again.");
    if (v.kind && v.kind !== "roster") picker.remember(v);
    if (body.optionId) {
      state.myVote = body.optionId;
      sessionStorage.setItem(voteKey(state.pollId), body.optionId);
    }
    state.claimedIdentity = body.identity;
    setIdentity(body.identity);
    syncTaken();
    $("#id-overlay").hidden = true;
  } catch (e) {
    $("#id-overlay").hidden = false;
    $("#identity-error").textContent = e.message;
    fetchState();
  } finally {
    state.identityBusy = false;
    syncIdentityBtn();
    render(state.data);
  }
}
function syncTaken() {
  const mine = state.claimedIdentity?.name.toLowerCase();
  picker.setTaken((state.data?.identities || []).map(i => i.name).filter(n => n.toLowerCase() !== mine));
}
// A ready-made card is one tap; your own wife needs a name first, then "Use her".
function syncIdentityBtn() {
  const v = picker.value;
  const custom = !!(v && v.kind === "custom") || !picker.querySelector('[data-testid="custom-panel"]').hidden;
  $("#id-actions").hidden = !custom;
  $("#id-add-btn").disabled = !(v && v.kind === "custom" && picker.valid) || state.identityBusy;
}
picker.addEventListener("pick", (e) => useIdentity(e.detail));
picker.addEventListener("change", syncIdentityBtn);
picker.addEventListener("click", () => setTimeout(syncIdentityBtn));

// ---------- lobby ----------
let optionRows = [];
let optionSeq = 0;

function optionRow(value) {
  const row = document.createElement("div");
  row.className = "opt-row";
  const input = document.createElement("input");
  input.type = "text";
  input.maxLength = 80;
  input.placeholder = "Option";
  input.setAttribute("aria-label", "Poll option");
  input.dataset.testid = "option-input";
  input.value = value || "";
  const del = document.createElement("button");
  del.type = "button";
  del.className = "ghost";
  const glyph = document.createElement("span");
  glyph.setAttribute("aria-hidden", "true");
  glyph.textContent = "×";
  del.append(glyph);
  del.setAttribute("aria-label", "Remove option");
  del.dataset.testid = "remove-option-btn";
  del.style.cssText = "min-width:0;padding:0 12px;font-size:1.1rem";
  const tip = document.createElement("span");
  tip.className = "tip";
  tip.setAttribute("role", "tooltip");
  tip.id = "tip-remove-" + (++optionSeq);
  tip.textContent = "Remove option";
  del.setAttribute("aria-describedby", tip.id);
  del.onclick = () => {
    optionRows = optionRows.filter((r) => r !== row);
    row.remove();
    if (optionRows.length < MIN_OPTIONS) addOptionRow();
    syncAddBtn();
  };
  row.append(input, del, tip);
  optionRows.push(row);
  $("#option-rows").append(row);
  syncAddBtn();
  return input;
}

function addOptionRow(value) {
  if (optionRows.length >= MAX_OPTIONS) return null;
  const input = optionRow(value);
  syncAddBtn();
  return input;
}

function syncAddBtn() {
  const btn = $("#add-option");
  btn.disabled = optionRows.length >= MAX_OPTIONS;
  btn.textContent = optionRows.length >= MAX_OPTIONS
    ? MAX_OPTIONS + " options max"
    : "+ Add option";
}

async function createPoll() {
  const question = $("#create-question").value.trim();
  const options = optionRows.map((r) => r.querySelector("input").value.trim()).filter(Boolean);
  const err = $("#create-err");
  err.textContent = "";
  if (!question) { err.textContent = "Ask a question first."; $("#create-question").focus(); return; }
  if (options.length < MIN_OPTIONS) { err.textContent = "Give at least " + MIN_OPTIONS + " options."; return; }
  $("#create-btn").disabled = true;
  try {
    const res = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, options }),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || "could not create poll");
    try { localStorage.setItem(ownerKey(body.id), body.ownerToken); } catch {}
    location.hash = "/" + body.id;
    history.pushState(null, "", "/poll/" + body.id);
    openPoll(body.id);
  } catch (e) {
    err.textContent = e.message;
  } finally {
    $("#create-btn").disabled = false;
  }
}

async function joinPoll() {
  const id = $("#join-code").value.trim().toLowerCase();
  const err = $("#join-err");
  err.textContent = "";
  if (!/^[a-z0-9]{6}$/.test(id)) { err.textContent = "Poll codes are 6 characters."; return; }
  $("#join-btn").disabled = true;
  try {
    const res = await fetch(API + "/" + id);
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || "poll not found");
    history.pushState(null, "", "/poll/" + id);
    openPoll(id);
  } catch (e) {
    err.textContent = e.message;
  } finally {
    $("#join-btn").disabled = false;
  }
}

// ---------- poll ----------
function showLobby() {
  $("#lobby-screen").hidden = false;
  $("#poll-screen").hidden = true;
  closeStreams();
}

function openPoll(id) {
  state.pollId = id;
  state.ownerToken = ownerTokenFor(id);
  state.myVote = sessionStorage.getItem(voteKey(id)) || null;
  state.claimedIdentity = null;
  state.data = null;
  $("#lobby-screen").hidden = true;
  $("#poll-screen").hidden = false;
  $("[data-testid='poll-code']").textContent = id;
  $("#share-url").value = location.origin + "/poll/" + id;
  $("#close-btn").hidden = !state.ownerToken;
  renderChip();
  render(state.data);
  fetchState();
  subscribe();
  if (!getIdentity()) showIdentityPicker();
  else useIdentity(getIdentity(), true);
}

function closeStreams() {
  if (state.es) { state.es.close(); state.es = null; }
  if (state.pollTimer) { clearInterval(state.pollTimer); state.pollTimer = null; }
  setLive(false, "offline");
}

function setLive(on, text) {
  const el = $("#live");
  el.classList.toggle("on", !!on);
  $("#live-text").textContent = text;
}

async function fetchState() {
  if (!state.pollId) return;
  try {
    const res = await fetch(API + "/" + state.pollId);
    if (!res.ok) {
      if (res.status === 404) { showLobby(); return; }
      throw new Error("state unavailable");
    }
    accept(await res.json());
  } catch { /* keep last paint, SSE/poll will retry */ }
}

// SSE and the fallback GET can arrive out of order; keep the newest.
function accept(data) {
  if (!data || data.id !== state.pollId) return;
  if (state.data && state.data.id === data.id && (data.rev || 0) < (state.data.rev || 0)) return;
  state.data = data;
  syncTaken();
  render(data);
}

function subscribe() {
  if (state.es) state.es.close();
  const es = new EventSource(API + "/" + state.pollId + "/events");
  state.es = es;
  es.onopen = () => setLive(true, "live");
  es.onmessage = (ev) => {
    try { accept(JSON.parse(ev.data)); setLive(true, "live"); } catch {}
  };
  es.onerror = () => {
    setLive(false, "reconnecting");
    // EventSource retries on its own; also poll as a fallback
    if (!state.pollTimer) state.pollTimer = setInterval(fetchState, 4000);
  };
}

function render(data) {
  if (!data || !state.pollId) return;
  const closed = !!data.closed;
  document.title = data.question + " — Poll · Business Wife";
  $("#question").textContent = data.question;
  $("#closed-banner").classList.toggle("on", closed);
  $("#close-btn").hidden = !(state.ownerToken && !closed);

  const total = data.totalVotes || 0;
  const showResults = closed || state.myVote != null;
  const box = $("#options");
  box.innerHTML = "";
  for (const opt of data.options) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "option";
    btn.dataset.testid = "option";
    btn.dataset.optionId = opt.id;
    btn.disabled = closed || state.myVote != null || state.voting || !state.claimedIdentity;
    if (state.myVote === opt.id) btn.classList.add("mine");
    const pct = total ? Math.round((opt.count / total) * 100) : 0;
    const bar = document.createElement("span");
    bar.className = "bar";
    bar.dataset.testid = "option-bar";
    bar.style.width = (showResults ? pct : 0) + "%";
    const txt = document.createElement("span");
    txt.className = "txt";
    const line = document.createElement("span");
    line.className = "opt-line";
    const label = document.createElement("span");
    label.textContent = opt.label;
    const pctEl = document.createElement("span");
    pctEl.className = "pct";
    pctEl.dataset.testid = "option-count";
    pctEl.textContent = showResults ? opt.count + " · " + pct + "%" : "";
    line.append(label, pctEl);
    txt.append(line);
    if (showResults && Array.isArray(opt.voters) && opt.voters.length) {
      const v = document.createElement("span");
      v.className = "voters";
      v.dataset.testid = "option-voters";
      for (const voter of opt.voters.slice(0, 5)) {
        const cell = document.createElement("span");
        cell.title = voter.name;
        cell.innerHTML = avatarHtml(voter.icon, voter.raw);
        v.appendChild(cell);
      }
      if (opt.voters.length > 5) {
        const plus = document.createElement("span");
        plus.className = "plus";
        plus.textContent = "+" + (opt.voters.length - 5) + " more";
        v.appendChild(plus);
      }
      txt.append(v);
    }
    btn.append(bar, txt);
    btn.onclick = () => vote(opt.id);
    box.append(btn);
  }

  const tally = $("#tally");
  let tallyHtml = "<strong>" + total + "</strong> vote" + (total === 1 ? "" : "s") +
    " · " + data.options.length + " options" +
    (state.myVote ? " — your vote is final" : showResults ? "" : " — vote to see the split");
  if (showResults && Array.isArray(data.voters) && data.voters.length) {
    const names = data.voters.slice(0, 3).map(v => escapeHtml(v.name));
    const extra = data.voters.length > 3 ? " +" + (data.voters.length - 3) + " more" : "";
    tallyHtml += " — " + names.join(", ") + extra + " have voted";
  }
  tally.innerHTML = tallyHtml;
}

async function vote(optionId) {
  if (!state.pollId || state.myVote || state.voting || state.data?.closed) return;
  const id = state.claimedIdentity;
  if (!id) { showIdentityPicker(); return; }
  state.voting = true;
  render(state.data);
  renderChip();
  try {
    const res = await fetch(API + "/" + state.pollId + "/vote", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ voterId: state.voterId, optionId, name: id && id.name, icon: id && id.icon, raw: id && id.icon && id.raw ? true : undefined }),
    });
    const body = await res.json().catch(() => ({}));
    // Recover the accepted ballot after a lost response or stale tab state.
    if (res.status === 409 && body.optionId) {
      state.myVote = body.optionId;
      sessionStorage.setItem(voteKey(state.pollId), body.optionId);
      fetchState();
      return;
    }
    if (!res.ok) throw new Error(body.error || "vote failed");
    state.myVote = optionId;
    sessionStorage.setItem(voteKey(state.pollId), optionId);
    render(state.data);
    fetchState();
  } catch (e) {
    $("#tally").textContent = e.message;
  } finally {
    state.voting = false;
    if (state.myVote) render(state.data);
    else $("#options").querySelectorAll("button").forEach((b) => { b.disabled = !!state.data?.closed || !state.claimedIdentity; });
    renderChip();
  }
}

async function closePoll() {
  if (!state.pollId) return;
  $("#close-btn").disabled = true;
  try {
    const res = await fetch(API + "/" + state.pollId + "/close", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ownerToken: state.ownerToken }),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || "could not close");
    fetchState();
  } catch (e) {
    $("#tally").textContent = e.message;
  } finally {
    $("#close-btn").disabled = false;
  }
}

function route() {
  const m = location.pathname.match(/^\/poll\/([a-z0-9]{6})\/?$/);
  if (m) {
    const id = m[1];
    if (id !== state.pollId) openPoll(id);
  } else {
    state.pollId = null;
    showLobby();
  }
}

// ---------- wire up ----------
addOptionRow();
addOptionRow();
$("#add-option").onclick = () => { const i = addOptionRow(); if (i) i.focus(); };
$("#create-btn").onclick = createPoll;
$("#join-btn").onclick = joinPoll;
$("#join-code").addEventListener("keydown", (e) => { if (e.key === "Enter") joinPoll(); });
$("#close-btn").onclick = closePoll;
$("#you-chip").onclick = showIdentityPicker;
$("#id-add-btn").onclick = () => useIdentity(picker.value);
$("#new-btn").onclick = () => { history.pushState(null, "", "/poll/"); route(); };
$("#copy-btn").onclick = async () => {
  const input = $("#share-url");
  try { await navigator.clipboard.writeText(input.value); }
  catch { input.select(); document.execCommand && document.execCommand("selectAll"); }
  $("#copy-btn").textContent = "Copied";
  setTimeout(() => { $("#copy-btn").textContent = "Copy"; }, 1200);
};
window.addEventListener("popstate", route);
route();

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/poll/sw.js").catch(() => {});
}
</script>
