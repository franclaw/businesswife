<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pomodoro — Business Wife</title>
<meta name="theme-color" content="#0f0c0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Focus block timer. She's timing you.">
<link rel="manifest" href="/pomodoro/manifest.webmanifest">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/pomodoro/icons/icon-192.png">
<link rel="stylesheet" href="/components/theme.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: max(20px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .panel {
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px 22px 24px;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .mode {
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--faint);
    margin-bottom: 12px;
  }
  .mode.focus { color: var(--accent-text); }
  .mode.break { color: var(--gold); }
  .digits {
    font-family: var(--mono);
    font-size: clamp(4.2rem, 18vw, 5.6rem);
    font-weight: 500;
    letter-spacing: 0.04em;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    margin: 8px 0 20px;
  }
  .sessions {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 28px;
  }
  .sessions strong { color: var(--text); font-weight: 600; }
  .controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  button {
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    border-radius: 8px;
    border: 0;
    padding: 14px 22px;
    cursor: pointer;
    min-width: 108px;
  }
  .primary {
    background: var(--accent);
    color: #fff;
  }
  .primary:hover { background: var(--accent-hover); }
  .ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border-strong);
  }
  .ghost:hover { color: var(--text); border-color: var(--muted); }
  .presets {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 28px;
  }
  .presets button {
    min-width: 0;
    padding: 10px 14px;
    font-size: 0.82rem;
    font-weight: 500;
    background: var(--surface-2);
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .presets button.on {
    color: var(--text);
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .custom {
    display: flex;
    gap: 8px;
    justify-content: center;
    align-items: center;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  .custom label {
    color: var(--faint);
    font-size: 0.78rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .custom input {
    width: 56px;
    padding: 8px;
    border-radius: 6px;
    border: 1px solid var(--border-strong);
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 0.95rem;
    text-align: center;
  }
  .controls .bell {
    min-width: 0;
    width: 50px;
    padding: 0;
    font-size: 1.05rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .bell[aria-pressed="true"] { color: var(--gold); border-color: rgba(201, 162, 39, 0.5); }
  .bell.blocked { opacity: 0.55; }
  .bell svg { width: 18px; height: 18px; }
  .ask {
    margin: 18px auto 0;
    max-width: 34ch;
    color: var(--muted);
    font-size: 0.86rem;
    line-height: 1.5;
  }
  .ask .row { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
  .ask button { min-width: 0; padding: 8px 14px; font-size: 0.82rem; }
  .note { margin-top: 14px; color: var(--faint); font-size: 0.78rem; min-height: 1.2em; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }
  .install-hint {
    margin-top: 22px;
    color: var(--faint);
    font-size: 0.75rem;
    line-height: 1.5;
    max-width: 36ch;
    margin-left: auto;
    margin-right: auto;
  }
</style>
</head>
<body>
  <header class="bw-head">
    <a class="bw-brand" href="/">Business Wife</a>
    <p class="bw-kicker">Focus</p>
    <h1>Pomodoro</h1>
    <p class="bw-sub">She's timing you.</p>
  </header>

  <div class="panel">
    <div class="mode focus" id="modeLabel">Focus</div>
    <div class="digits" id="digits" data-testid="digits">25:00</div>
    <p class="sr-only" id="announce" role="status"></p>
    <div class="sessions">Sessions closed: <strong id="sessionCount">0</strong></div>
    <div class="controls">
      <button class="primary" id="toggleBtn" type="button">Start</button>
      <button class="ghost" id="resetBtn" type="button">Reset</button>
      <button class="ghost bell" id="bellBtn" data-testid="bell" type="button" aria-pressed="false" aria-label="Notify me when a block ends" title="Notify me when a block ends"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></button>
    </div>
    <div class="ask" id="ask" data-testid="notify-ask" hidden>
      Want a quiet notification when this block ends, even in another tab?
      <div class="row">
        <button class="primary" type="button" id="askYes" data-testid="notify-yes">Notify me</button>
        <button class="ghost" type="button" id="askNo" data-testid="notify-no">Not now</button>
      </div>
    </div>
    <p class="note" id="note" data-testid="notify-note"></p>
    <div class="presets" role="group" aria-label="Presets">
      <button type="button" data-focus="25" data-break="5" class="on">25 / 5</button>
      <button type="button" data-focus="15" data-break="3">15 / 3</button>
      <button type="button" data-focus="50" data-break="10">50 / 10</button>
      <button type="button" id="customBtn">Custom</button>
    </div>
    <div class="custom" id="customRow" hidden>
      <label>Focus <input id="customFocus" type="number" min="1" max="120" value="25"> min</label>
      <label>Break <input id="customBreak" type="number" min="1" max="60" value="5"> min</label>
      <button class="ghost" type="button" id="applyCustom" style="min-width:0;padding:8px 12px;font-size:0.82rem">Apply</button>
    </div>
    <p class="install-hint">Install her from your browser menu to keep her on your home screen. Works offline.</p>
  </div>

<script>
const KEY = "bw_pomodoro_v1";
const $ = (id) => document.getElementById(id);

let state = load();
let tickTimer = null;

function defaults() {
  return {
    focusMin: 25,
    breakMin: 5,
    mode: "focus", // focus | break
    remainingMs: 25 * 60 * 1000,
    running: false,
    endsAt: null,
    sessions: 0,
  };
}

function load() {
  try {
    const raw = JSON.parse(localStorage.getItem(KEY) || "null");
    if (!raw) return defaults();
    const s = Object.assign(defaults(), raw);
    if (s.running && s.endsAt) s.remainingMs = Math.max(0, s.endsAt - Date.now());
    return s;
  } catch {
    return defaults();
  }
}

function save() {
  localStorage.setItem(KEY, JSON.stringify({
    focusMin: state.focusMin,
    breakMin: state.breakMin,
    mode: state.mode,
    remainingMs: state.remainingMs,
    running: state.running,
    endsAt: state.endsAt,
    sessions: state.sessions,
  }));
}

function fmt(ms) {
  const sec = Math.ceil(ms / 1000);
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}

// The tab title carries the countdown, so the clock is readable from any tab.
const BASE_TITLE = "Pomodoro — Business Wife";
let doneTitle = null;
function paintTitle() {
  if (doneTitle) { document.title = doneTitle; return; }
  const label = state.mode === "focus" ? "Focus" : "Break";
  if (state.running) document.title = fmt(state.remainingMs) + " · " + label + " — Pomodoro";
  else if (state.remainingMs < durationMs()) document.title = "Paused " + fmt(state.remainingMs) + " — Pomodoro";
  else document.title = BASE_TITLE;
}

function paint() {
  paintTitle();
  $("digits").textContent = fmt(state.remainingMs);
  $("sessionCount").textContent = String(state.sessions);
  const label = $("modeLabel");
  label.textContent = state.mode === "focus" ? "Focus" : "Break";
  label.className = "mode " + (state.mode === "focus" ? "focus" : "break");
  $("toggleBtn").textContent = state.running ? "Pause" : (state.remainingMs < durationMs() ? "Resume" : "Start");
  document.querySelectorAll(".presets [data-focus]").forEach((b) => {
    b.classList.toggle("on",
      Number(b.dataset.focus) === state.focusMin && Number(b.dataset.break) === state.breakMin);
  });
}

function durationMs() {
  return (state.mode === "focus" ? state.focusMin : state.breakMin) * 60 * 1000;
}

function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = "sine";
    o.frequency.value = 660;
    g.gain.value = 0.08;
    o.connect(g);
    g.connect(ctx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
    o.stop(ctx.currentTime + 0.65);
    setTimeout(() => ctx.close(), 800);
  } catch {}
  try { if (navigator.vibrate) navigator.vibrate([80, 40, 80]); } catch {}
}

// ---------- notifications ----------
// Opt-in only: nothing is asked on load. The first Start offers a quiet
// "Notify me"; the bell toggles it afterwards. Without permission (denied or
// unsupported) she still chimes and the tab title says the block is over.
const NOTIFY_KEY = "bw_pomodoro_notify"; // "on" | "off" | null (never asked)
const canNotify = () => "Notification" in window;
const permission = () => (canNotify() ? Notification.permission : "unsupported");
function notifyPref() { try { return localStorage.getItem(NOTIFY_KEY); } catch { return null; } }
function setNotifyPref(v) { try { localStorage.setItem(NOTIFY_KEY, v); } catch {} paintBell(); }
const notifyOn = () => notifyPref() === "on" && permission() === "granted";

function paintBell() {
  const bell = $("bellBtn");
  const on = notifyOn();
  const blocked = permission() === "denied" || permission() === "unsupported";
  bell.setAttribute("aria-pressed", String(on));
  bell.classList.toggle("blocked", blocked);
  const label = blocked
    ? "Notifications are unavailable here; she will chime and show it in the tab title"
    : on ? "Notifications on — tap to turn off" : "Notify me when a block ends";
  bell.title = label;
  bell.setAttribute("aria-label", label);
}

function say(text) {
  $("note").textContent = text;
}

async function askPermission() {
  $("ask").hidden = true;
  if (!canNotify()) { setNotifyPref("off"); say("This browser can't notify. She'll chime and update the tab title instead."); return; }
  let result = Notification.permission;
  if (result === "default") {
    try { result = await Notification.requestPermission(); } catch { result = Notification.permission; }
  }
  if (result === "granted") { setNotifyPref("on"); say("She'll let you know when the block ends."); }
  else { setNotifyPref("off"); say("No notifications, then. She'll chime and show it in the tab title."); }
}

function maybeOfferNotifications() {
  if (notifyPref() !== null || !canNotify() || permission() === "denied") return;
  if (permission() === "granted") { setNotifyPref("on"); return; }
  $("ask").hidden = false;
}

async function showNotification(title, body) {
  const opts = { body, tag: "bw-pomodoro", renotify: true, icon: "/pomodoro/icons/icon-192.png", badge: "/favicon.png" };
  // The service worker's showNotification also works from a background tab
  // and on Android, where `new Notification()` is not allowed.
  try {
    const reg = "serviceWorker" in navigator ? await navigator.serviceWorker.getRegistration("/pomodoro/") : null;
    if (reg && typeof reg.showNotification === "function") { await reg.showNotification(title, opts); return true; }
  } catch {}
  try { new Notification(title, opts); return true; } catch { return false; }
}

function announceEnd(endedMode) {
  const next = state.mode === "focus" ? state.focusMin : state.breakMin;
  const title = endedMode === "focus" ? "Focus block closed." : "Break's over.";
  const body = endedMode === "focus"
    ? "Take " + next + " minutes. Start the break when you're ready."
    : "Back to it — " + next + " minutes on the clock when you're ready.";
  $("announce").textContent = title + " " + body;
  if (document.visibilityState !== "visible") {
    doneTitle = "✓ " + title + " — Pomodoro";
    paintTitle();
  }
  if (notifyOn() && document.visibilityState !== "visible") showNotification(title, body);
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    doneTitle = null;
    tick();
    paint();
  }
});

function completeBlock(quiet) {
  const ended = state.mode;
  if (!quiet) beep();
  if (state.mode === "focus") {
    state.sessions += 1;
    state.mode = "break";
    state.remainingMs = state.breakMin * 60 * 1000;
  } else {
    state.mode = "focus";
    state.remainingMs = state.focusMin * 60 * 1000;
  }
  state.running = false;
  state.endsAt = null;
  save();
  if (!quiet) announceEnd(ended);
  paint();
}

// Time is always endsAt − now. The 250 ms interval only repaints (browsers
// throttle it in background tabs); a single timeout aimed at endsAt ends the
// block on time, and coming back to the tab catches up at once.
let endTimer = null;
function stopTimers() {
  if (tickTimer) { clearInterval(tickTimer); tickTimer = null; }
  if (endTimer) { clearTimeout(endTimer); endTimer = null; }
}
function startTimers() {
  stopTimers();
  tickTimer = setInterval(tick, 250);
  endTimer = setTimeout(tick, Math.max(0, state.endsAt - Date.now()) + 20);
}

function tick() {
  if (!state.running || !state.endsAt) return;
  state.remainingMs = Math.max(0, state.endsAt - Date.now());
  if (state.remainingMs <= 0) {
    stopTimers();
    completeBlock(false);
    return;
  }
  paint();
}

function start() {
  if (state.remainingMs <= 0) state.remainingMs = durationMs();
  doneTitle = null;
  state.running = true;
  state.endsAt = Date.now() + state.remainingMs;
  save();
  paint();
  startTimers();
  maybeOfferNotifications();
}

function pause() {
  if (state.running && state.endsAt) {
    state.remainingMs = Math.max(0, state.endsAt - Date.now());
  }
  state.running = false;
  state.endsAt = null;
  save();
  paint();
  stopTimers();
}

function reset() {
  pause();
  state.mode = "focus";
  state.remainingMs = state.focusMin * 60 * 1000;
  save();
  paint();
}

function setPreset(f, b) {
  pause();
  state.focusMin = f;
  state.breakMin = b;
  state.mode = "focus";
  state.remainingMs = f * 60 * 1000;
  save();
  paint();
}

$("toggleBtn").onclick = () => state.running ? pause() : start();
$("askYes").onclick = askPermission;
$("askNo").onclick = () => { $("ask").hidden = true; setNotifyPref("off"); say("Fine. The bell turns it on later."); };
$("bellBtn").onclick = () => {
  if (notifyOn()) { setNotifyPref("off"); say("Notifications off."); return; }
  if (permission() === "denied") { say("Notifications are blocked in this browser's site settings. She'll chime and show it in the tab title."); return; }
  if (permission() === "unsupported") { say("This browser can't notify. She'll chime and show it in the tab title."); return; }
  askPermission();
};
$("resetBtn").onclick = reset;

document.querySelectorAll(".presets [data-focus]").forEach((b) => {
  b.onclick = () => {
    $("customRow").hidden = true;
    setPreset(Number(b.dataset.focus), Number(b.dataset.break));
  };
});
$("customBtn").onclick = () => {
  $("customRow").hidden = !$("customRow").hidden;
};
$("applyCustom").onclick = () => {
  const f = Math.min(120, Math.max(1, Number($("customFocus").value) || 25));
  const b = Math.min(60, Math.max(1, Number($("customBreak").value) || 5));
  $("customFocus").value = f;
  $("customBreak").value = b;
  setPreset(f, b);
};

paintBell();
if (state.running && state.endsAt && state.endsAt <= Date.now()) {
  // The block ended while the page was closed: move on quietly.
  completeBlock(true);
}
paint();
if (state.running) startTimers();

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/pomodoro/sw.js", { scope: "/pomodoro/" }).catch(() => {});
}
</script>
</body>
</html>
